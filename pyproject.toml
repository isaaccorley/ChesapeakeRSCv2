[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chesapeakersc"]

[tool.hatch.build.targets.sdist]
include = ["src/chesapeakersc", "pyproject.toml", "README.md"]

[project]
name = "chesapeakersc-v2"
version = "0.1.0"
description = "Road segmentation with visible and canopy-covered road labels"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "kornia>=0.8,<0.9",
    "lightning>=2.5,<3",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18",
    "rasterio>=1.4,<2",
    "segmentation-models-pytorch>=0.5,<0.6",
    "tensorboard>=2.18",
    "torch>=2.6,<3",
    "torchgeo>=0.10,<0.11",
    "torchmetrics>=1.6,<2",
    "torchvision>=0.21,<1",
]

[dependency-groups]
dataset = [
    "geopandas>=1.0,<2",
    "planetary-computer>=1.0,<2",
    "pyproj>=3.7,<4",
    "pystac-client>=0.8,<1",
    "shapely>=2.0,<3",
]
release = [
    "huggingface-hub>=0.27,<2",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
    "onnxscript>=0.3,<1",
]
dev = [
    "pyrefly>=0.40",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14",
    "ty>=0.0.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["src", "dataset", "release", "tests", "train.py", "dwr_eval.py"]

[tool.pyrefly]
search-path = [".", "src"]
project-includes = ["src/**/*.py", "dataset/**/*.py", "release/**/*.py", "tests/**/*.py", "train.py", "dwr_eval.py"]
project-excludes = [".venv/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["chesapeakersc", "dataset", "release"]
